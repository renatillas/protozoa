name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.13.0"
          rebar3-version: "3"
          # elixir-version: "1"
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
      - name: Regenerate integration fixtures
        working-directory: test_protozoa
        run: gleam run -m codegen
      - name: Check generated fixture freshness
        working-directory: test_protozoa
        run: git diff --exit-code -- src/generated_*.gleam
      - name: Test compiled generated codecs
        working-directory: test_protozoa
        run: gleam test
